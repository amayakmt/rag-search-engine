[project]
name = "rag-search-engine"
version = "0.1.0"
description = "Movie retrieval with keyword, semantic, hybrid, multimodal search, and RAG"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "nltk==3.9.1",
    "numpy==2.3.3",
    "openai==2.44.0",
    "pillow>=12.3.0",
    "python-dotenv==1.1.0",
    "sentence-transformers>=6.0.1",
]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project.scripts]
rag-keyword = "cli.keyword_search_cli:main"
rag-semantic = "cli.semantic_search_cli:main"
rag-hybrid = "cli.hybrid_search_cli:main"
rag-generate = "cli.augmented_generation_cli:main"
rag-evaluate = "cli.evaluation_cli:main"
rag-multimodal = "cli.multimodal_search_cli:main"
rag-describe-image = "cli.describe_image_cli:main"

[tool.setuptools.packages.find]
include = ["rag_search_engine*", "cli*"]
